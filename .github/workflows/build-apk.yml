name: Build Android APK & Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build APK & Deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Bundle
        run: node build.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Bundle APK into Web Directory
        run: |
          # 1. Locate the compiled APK file
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)

          # 2. Copy the APK into your web root directory as FlowTick.apk
          cp "$APK_PATH" ./FlowTick.apk
          cp "$APK_PATH" ./build/FlowTick.apk

          echo "APK successfully bundled into web root."

      - name: Prepare APKs with Versioning
        run: |
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | awk -F '"' '{print $2}')
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_PATH" "FlowTick-v${VERSION_NAME}.apk"
          cp "$APK_PATH" "FlowTick-latest.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowTick-APK
          path: FlowTick.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "FlowTick v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          files: |
            FlowTick-v${{ env.APP_VERSION }}.apk
            FlowTick-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Point to your web root folder containing index.html and FlowTick.apk

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
